version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - cyclop
    - depguard
    - funlen
    - gosec
    - importas
    - interfacebloat
    - ireturn
    - modernize
    - nakedret
    - nestif
    - noctx
    - prealloc
    - predeclared
    - sloglint
    - tagalign
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    # The dogfood check for the baseline internal/analyzer/delegation/golangcilint forces on
    # every consumer project (knowledge/standards/rules/infra/build.md #9): the same six run
    # here via normal config enablement rather than -E, plus the two linters that rule
    # documents as recommended-but-not-forced because they can flood a legacy project.
    - nolintlint
    - paralleltest
    - tparallel
    - thelper
    - forcetypeassert
    - nilerr
    - bodyclose
    - sqlclosecheck
    # knowledge/standards/rules/process/code-smells.md also names dupl, goconst, and
    # gochecknoglobals as the linters that catch the smells it catalogs; the gap below is
    # deliberate, not an oversight. goconst is measured at ~50 findings, almost all emoji/theme
    # data tables (false positives for this codebase). dupl finds nothing at its default 150-token
    # threshold, because the duplication that shows up here is smaller than that: a repeated
    # 6-line helper, not a repeated function. Neither is enabled.
    # gochecknoglobals has not been measured against this codebase and is left off pending
    # that evaluation.
  settings:
    # golangci-lint's own default for staticcheck is "all" minus ST1000, ST1003,
    # ST1016, ST1020, ST1021, ST1022 and ST1023. This list is that default with the
    # three doc-comment-form checks put back: ST1020 (exported func), ST1021
    # (exported type), ST1022 (exported var/const) all require the comment to open
    # with the identifier it documents - which effective-go.md #3 already demands in
    # prose, so this is the machine finally carrying an obligation we were writing
    # down and never checking. Spelling out the surviving exclusions matters: a bare
    # `checks: [ST1020, ST1021, ST1022]` REPLACES the default set rather than adding
    # to it, silently dropping every SA check (verified against golangci-lint v2.12.2
    # with an SA9003 probe). ST1000 stays off - it wants a package comment on every
    # package, which is the opposite of effective-go.md #3's "no package docstrings"
    # and would fire 194 times here.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1023
    govet:
      enable:
        - shadow
    funlen:
      lines: 80
      statements: 0
    cyclop:
      max-complexity: 15
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        - anon
    depguard:
      rules:
        Main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/0b1-PulsarTech/pulsarules_codex
            - gopkg.in/yaml.v3
            - github.com/wrapped-owls/goremy-di/remy
    wrapcheck:
      ignore-package-globs:
        - github.com/0b1-PulsarTech/pulsarules_codex/**
    # require-explanation/require-specific make nolintlint enforce this repo's own rule
    # (knowledge/standards/rules/infra/build.md #9): every //nolint must name its linter and
    # carry a reason. -E alone (the forced-baseline mechanism for consumer projects) cannot set
    # this - it only enables the linter at its permissive defaults - so a consumer project must
    # opt into the same strictness itself if it wants it.
    # allow-unused is forced true (overriding gosec's own truthful non-test findings, which we
    # fixed by hand) because nolintlint's "is this //nolint still needed" check reruns gosec's
    # whole-program taint analysis and, verified by repeated `golangci-lint run` invocations
    # against this exact tree (including with -j 1), which *_test.go nolint:gosec directives it
    # calls unused is non-deterministic run to run - a CI gate built on it would flake.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - golines
    - goimports
  exclusions:
    generated: strict

run:
  timeout: 5m
  modules-download-mode: readonly

# Both capped by default (max-same-issues: 3, max-issues-per-linter: 50). A pervasive smell
# (e.g. many identically-worded thelper/nolintlint findings) would otherwise be silently
# truncated - some findings hidden run to run depending on internal ordering - so a "0 findings"
# governance run could pass while real violations remain unfixed. Disabled so the dogfood check
# in this repo's own tree is exhaustive and deterministic.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
