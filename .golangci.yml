version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - cyclop
    - depguard
    - funlen
    - gosec
    - importas
    - interfacebloat
    - ireturn
    - modernize
    - nakedret
    - nestif
    - noctx
    - prealloc
    - predeclared
    - sloglint
    - tagalign
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    # The baseline golangcilint forces on consumers (build.md #9), plus two recommended extras.
    - nolintlint
    - paralleltest
    - tparallel
    - thelper
    - forcetypeassert
    - nilerr
    - bodyclose
    - sqlclosecheck
    # dupl and goconst stay off: goconst flags emoji and theme data tables, and dupl finds
    # nothing at its default threshold. gochecknoglobals stays off: package-level-var covers it.
  settings:
    # ST1020-ST1022 demand a doc comment that opens with the symbol name, which contradicts
    # the doc-comment analyzer banning doc comments. Spell out the default exclusions: a bare
    # `checks: [...]` list replaces the default set and would silently drop every SA check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -ST1023
    govet:
      enable:
        - shadow
    funlen:
      lines: 80
      statements: 0
    cyclop:
      max-complexity: 15
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        - anon
    depguard:
      rules:
        Main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/0b1-PulsarTech/pulsarules_codex
            - gopkg.in/yaml.v3
            - github.com/wrapped-owls/goremy-di/remy
    wrapcheck:
      ignore-package-globs:
        - github.com/0b1-PulsarTech/pulsarules_codex/**
    # require-explanation/require-specific make nolintlint enforce this repo's own rule
    # (knowledge/standards/rules/infra/build.md #9): every //nolint must name its linter and
    # carry a reason. -E alone (the forced-baseline mechanism for consumer projects) cannot set
    # this - it only enables the linter at its permissive defaults - so a consumer project must
    # opt into the same strictness itself if it wants it.
    # allow-unused stays true: nolintlint's unused check is nondeterministic under gosec.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - golines
    - goimports
  exclusions:
    generated: strict

run:
  timeout: 5m
  modules-download-mode: readonly

# Both capped by default (max-same-issues: 3, max-issues-per-linter: 50). A pervasive smell
# (e.g. many identically-worded thelper/nolintlint findings) would otherwise be silently
# truncated - some findings hidden run to run depending on internal ordering - so a "0 findings"
# governance run could pass while real violations remain unfixed. Disabled so the dogfood check
# in this repo's own tree is exhaustive and deterministic.
issues:
  max-same-issues: 0
  max-issues-per-linter: 0
