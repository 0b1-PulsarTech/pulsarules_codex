version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - cyclop
    - depguard
    - funlen
    - gosec
    - importas
    - interfacebloat
    - ireturn
    - modernize
    - nakedret
    - nestif
    - noctx
    - prealloc
    - predeclared
    - sloglint
    - tagalign
    - unconvert
    - unparam
    - whitespace
    - wrapcheck
    # The baseline golangcilint forces on consumers (build.md #9), plus two recommended extras.
    - nolintlint
    - paralleltest
    - tparallel
    - thelper
    - forcetypeassert
    - nilerr
    - bodyclose
    - sqlclosecheck
  settings:
    govet:
      enable:
        - shadow
    funlen:
      lines: 80
      statements: 0
    cyclop:
      max-complexity: 15
    ireturn:
      allow:
        - error
        - empty
        - stdlib
        - generic
        - anon
    depguard:
      rules:
        Main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/0b1-PulsarTech/pulsarules_codex
            - gopkg.in/yaml.v3
            - github.com/wrapped-owls/goremy-di/remy
    wrapcheck:
      ignorePackageGlobs:
        - github.com/0b1-PulsarTech/pulsarules_codex/**
    # require-explanation/require-specific make nolintlint enforce this repo's own rule
    # (knowledge/standards/rules/infra/build.md #9): every //nolint must name its linter and
    # carry a reason. -E alone (the forced-baseline mechanism for consumer projects) cannot set
    # this - it only enables the linter at its permissive defaults - so a consumer project must
    # opt into the same strictness itself if it wants it.
    # allow-unused stays true: nolintlint's unused check is nondeterministic under gosec.
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true
  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - wrapcheck

formatters:
  enable:
    - gofumpt
    - golines
    - goimports
  exclusions:
    generated: strict

run:
  timeout: 5m
  modules-download-mode: readonly
